<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>DEFENDER</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=50">
</head>
<body>
<div id="topbar">
  <a id="back-link" href="https://wethepeoplepress.com/games/">&larr; WTP ARCADE</a>
  <span>
  <button type="button" id="btn-pause" class="mini-btn" aria-label="Pause">PAUSE</button>
  <button type="button" id="btn-mute" class="mini-btn" aria-label="Toggle sound">SOUND ON</button>
  </span>
</div>
<div id="stage">
  <div id="canvas-wrap"><canvas id="game" width="292" height="240" aria-label="Defender game"></canvas></div>
</div>
<div id="pad-left" class="pad">
  <div id="dpad" aria-label="Arrow pad">
    <span class="tbtn arr" data-k="up" style="grid-area:u">&#9650;</span>
    <span class="tbtn arr" data-k="left" style="grid-area:l">&#9664;</span>
    <span class="tbtn arr" data-k="right" style="grid-area:r">&#9654;</span>
    <span class="tbtn arr" data-k="down" style="grid-area:d">&#9660;</span>
  </div>
</div>
<div id="pad-right" class="pad">
  <div class="row">
    <button type="button" class="tbtn sm" data-k="bomb">BOMB</button>
    <button type="button" class="tbtn sm" data-k="hyper">HYPER</button>
  </div>
  <div class="row"><button type="button" class="tbtn fire" data-k="fire">FIRE</button></div>
</div>
<div id="help">&larr;&rarr; / A D - FACE &amp; THRUST &middot; &uarr;&darr; / W S - UP/DOWN &middot; SPACE / CTRL - FIRE &middot; B / Z - SMART BOMB &middot; H / X - HYPERSPACE &middot; 5 - COIN &middot; ENTER / 1 - START &middot; P - PAUSE &middot; M - SOUND &middot; BUILD 50</div>
<div id="rotate-hint">ROTATE FOR BEST PLAY &#8635;</div>
<script src="game.js?v=50"></script>
<script>(function(){var t;function f(){clearTimeout(t);t=setTimeout(function(){document.documentElement.style.height=window.innerHeight+"px";window.dispatchEvent(new Event("resize"));},60);}window.addEventListener("orientationchange",function(){f();setTimeout(f,350);setTimeout(f,800);});if(window.visualViewport)visualViewport.addEventListener("resize",f);if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener("change",f);})();</script>
</body>
</html>
