<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>DEFENDER</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=45">
</head>
<body>
<div id="topbar">
  <a id="back-link" href="https://wethepeoplepress.com/games/">&larr; WTP ARCADE</a>
  <span>
  <button type="button" id="btn-pause" class="mini-btn" aria-label="Pause">PAUSE</button>
  <button type="button" id="btn-mute" class="mini-btn" aria-label="Toggle sound">SOUND ON</button>
  </span>
</div>
<div id="stage">
  <div id="canvas-wrap"><canvas id="game" width="292" height="240" aria-label="Defender game"></canvas></div>
</div>
<div id="pad-left" class="pad">
  <button type="button" class="tbtn rock" data-k="up" aria-label="Up">&#9650;</button>
  <button type="button" class="tbtn rock" data-k="down" aria-label="Down">&#9660;</button>
</div>
<div id="pad-right" class="pad">
  <div class="row">
    <button type="button" class="tbtn sm" data-k="bomb">BOMB</button>
    <button type="button" class="tbtn sm" data-k="hyper">HYPER</button>
  </div>
  <div class="row">
    <button type="button" class="tbtn md" data-k="reverse">REVERSE</button>
    <button type="button" class="tbtn md" data-k="thrust">THRUST</button>
  </div>
  <div class="row"><button type="button" class="tbtn fire" data-k="fire">FIRE</button></div>
</div>
<div id="help">&uarr;&darr; / W S - UP/DOWN &middot; &rarr; / D - THRUST &middot; &larr; / A / SHIFT - REVERSE &middot; SPACE / CTRL - FIRE &middot; B / Z - SMART BOMB &middot; H / X - HYPERSPACE &middot; 5 - COIN &middot; ENTER / 1 - START &middot; P - PAUSE &middot; M - SOUND</div>
<div id="rotate-hint">ROTATE FOR BEST PLAY &#8635;</div>
<script src="game.js?v=45"></script>
</body>
</html>
